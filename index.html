                sorts: ["Без сортировки","Название темы (А → Я)","Название темы (Я → А)","Процент готовности (по возрастанию)","Процент готовности (по убыванию)","Коэффициент сложности (по возрастанию)","Коэффициент сложности (по убыванию)"]
            }
        ];

        // Глобальное состояние приложения
        let activeTicketNum = 1; // 0 = Общий алгоритм, 1..25 = Билеты
        let activeStageTab = 'all'; // 'all' | 'stage1' | 'stage2' | 'stage3' | 'stage4'
        let fontScale = 100;
        const codeRegistry = {}; // Хранилище чистого кода для безопасного копирования и скачивания

        // Загрузка состояния чек-листов из localStorage
        function getChecklistState() {
            try {
                return JSON.parse(localStorage.getItem('mdk0101_checklists') || '{}');
            } catch (e) {
                return {};
            }
        }

        function saveChecklistItem(ticketNum, itemIdx, checked) {
            const state = getChecklistState();
            const key = `t${ticketNum}_${itemIdx}`;
            if (checked) state[key] = true;
            else delete state[key];
            try {
                localStorage.setItem('mdk0101_checklists', JSON.stringify(state));
            } catch (e) {}
            updateSidebarProgress();
        }

        function updateSidebarProgress() {
            const state = getChecklistState();
            const completedTickets = TICKETS.filter(t =>
                state[`t${t.num}_0`] && state[`t${t.num}_1`] && state[`t${t.num}_2`]
            ).length;
            const badge = document.getElementById('sidebarProgressBadge');
            if (badge) {
                badge.textContent = `Сдано: ${completedTickets} / 25`;
            }
        }

        // Генераторы полного кода для каждого билета
        function buildSql(t) {
            const ltVals = t.lrows.map(r => `(${r[0]}, N'${r[1]}', N'${r[2]}')`).join(",\n");
            const mtVals = t.mrows.map(r => `(${r[0]}, N'${r[1]}', N'${r[2]}', ${r[3]}, N'${r[4]}', ${r[5]}, ${r[6]}, ${r[7].toFixed(2)}, N'${r[8]}')`).join(",\n");
            const ptVals = t.prows.map(r => `(${r[0]}, N'${r[1]}', N'${r[2]}', N'${r[3]}')`).join(",\n");
            const dtVals = t.drows.map(r => `(${r[0]}, N'${r[1]}', ${r[2]}, '${r[3]}', N'${r[4]}', ${r[5].toFixed(2)})`).join(",\n");
            const mmVals = t.mmrows.map(r => `(${r[0]}, ${r[1]}, ${r[2]}, ${r[3].toFixed(2)})`).join(",\n");

            return `-- ============================================================================
-- БИЛЕТ № ${t.num}. БАЗА ДАННЫХ: ${t.db} («${t.title}»)
-- ============================================================================
CREATE DATABASE ${t.db};
GO
USE ${t.db};
GO

-- 1. Таблица-справочник (Родительская таблица для фильтрации и ComboBox)
CREATE TABLE ${t.lt} (
    ID INT PRIMARY KEY IDENTITY(1,1),
    Title NVARCHAR(120) NOT NULL UNIQUE,
    Description NVARCHAR(MAX) NULL
);

-- 2. Основная сущность с изображениями (связь 1:M со справочником ${t.lt})
CREATE TABLE ${t.mt} (
    ID INT PRIMARY KEY IDENTITY(1,1),
    ${t.cc} NVARCHAR(40) NOT NULL UNIQUE,
    Title NVARCHAR(180) NOT NULL,
    ${t.fk} INT NOT NULL,
    Description NVARCHAR(MAX) NULL,
    ${t.m1} INT NOT NULL CHECK (${t.m1} >= 0),
    ${t.m2} INT NOT NULL CHECK (${t.m2} >= 0),
    ${t.pc} DECIMAL(12, 2) NOT NULL CHECK (${t.pc} >= 0),
    ImagePath NVARCHAR(255) NULL,
    CONSTRAINT FK_${t.mt}_${t.lt} FOREIGN KEY (${t.fk}) REFERENCES ${t.lt}(ID)
);

-- 3. Таблица субъектов / контрагентов (${t.ptr})
CREATE TABLE ${t.pt} (
    ID INT PRIMARY KEY IDENTITY(1,1),
    ${t.pc1[0]} NVARCHAR(160) NOT NULL,
    ${t.pc2[0]} NVARCHAR(100) NOT NULL,
    ${t.pc3[0]} NVARCHAR(150) NOT NULL
);

-- 4. Таблица учетных документов / журналов (${t.dtr})
CREATE TABLE ${t.dt} (
    ID INT PRIMARY KEY IDENTITY(1,1),
    DocNumber NVARCHAR(40) NOT NULL UNIQUE,
    PartyID INT NOT NULL,
    DocDate DATE NOT NULL DEFAULT GETDATE(),
    Status NVARCHAR(50) NOT NULL,
    TotalAmount DECIMAL(12, 2) NOT NULL CHECK (TotalAmount >= 0),
    CONSTRAINT FK_${t.dt}_${t.pt} FOREIGN KEY (PartyID) REFERENCES ${t.pt}(ID)
);

-- 5. Промежуточная таблица связи M:M (${t.mmtr})
CREATE TABLE ${t.mm} (
    DocID INT NOT NULL,
    MainID INT NOT NULL,
    Quantity INT NOT NULL CHECK (Quantity > 0),
    UnitPrice DECIMAL(12, 2) NOT NULL CHECK (UnitPrice >= 0),
    PRIMARY KEY (DocID, MainID),
    CONSTRAINT FK_${t.mm}_${t.dt} FOREIGN KEY (DocID) REFERENCES ${t.dt}(ID) ON DELETE CASCADE,
    CONSTRAINT FK_${t.mm}_${t.mt} FOREIGN KEY (MainID) REFERENCES ${t.mt}(ID)
);
GO

-- ============================================================================
-- НАПОЛНЕНИЕ ТАБЛИЦ ТЕСТОВЫМИ ДАННЫМИ (СОБЛЮДЕНИЕ ССЫЛОЧНОЙ ЦЕЛОСТНОСТИ)
-- ============================================================================
SET IDENTITY_INSERT ${t.lt} ON;
INSERT INTO ${t.lt} (ID, Title, Description) VALUES
${ltVals};
SET IDENTITY_INSERT ${t.lt} OFF;

SET IDENTITY_INSERT ${t.mt} ON;
INSERT INTO ${t.mt} (ID, ${t.cc}, Title, ${t.fk}, Description, ${t.m1}, ${t.m2}, ${t.pc}, ImagePath) VALUES
${mtVals};
SET IDENTITY_INSERT ${t.mt} OFF;

SET IDENTITY_INSERT ${t.pt} ON;
INSERT INTO ${t.pt} (ID, ${t.pc1[0]}, ${t.pc2[0]}, ${t.pc3[0]}) VALUES
${ptVals};
SET IDENTITY_INSERT ${t.pt} OFF;

SET IDENTITY_INSERT ${t.dt} ON;
INSERT INTO ${t.dt} (ID, DocNumber, PartyID, DocDate, Status, TotalAmount) VALUES
${dtVals};
SET IDENTITY_INSERT ${t.dt} OFF;

INSERT INTO ${t.mm} (DocID, MainID, Quantity, UnitPrice) VALUES
${mmVals};
GO

-- ============================================================================
-- ПРОВЕРОЧНЫЕ SQL-ЗАПРОСЫ (ВЕРИФИКАЦИЯ ЦЕЛОСТНОСТИ ДАННЫХ)
-- ============================================================================
SELECT '${t.lt}' AS [Таблица], COUNT(*) AS [Записей] FROM ${t.lt}
UNION ALL SELECT '${t.mt}', COUNT(*) FROM ${t.mt}
UNION ALL SELECT '${t.pt}', COUNT(*) FROM ${t.pt}
UNION ALL SELECT '${t.dt}', COUNT(*) FROM ${t.dt}
UNION ALL SELECT '${t.mm} (M:M)', COUNT(*) FROM ${t.mm};

-- Проверка JOIN (1:M и M:M)
SELECT m.${t.cc}, m.Title, l.Title AS [Категория], m.${t.pc}
FROM ${t.mt} m
JOIN ${t.lt} l ON m.${t.fk} = l.ID;

SELECT d.DocNumber, p.${t.pc1[0]}, m.Title, j.Quantity, (j.Quantity * j.UnitPrice) AS [Сумма]
FROM ${t.mm} j
JOIN ${t.dt} d ON j.DocID = d.ID
JOIN ${t.pt} p ON d.PartyID = p.ID
JOIN ${t.mt} m ON j.MainID = m.ID;`;
        }

        function buildTablesCs(t) {
            return `using System;
using System.Data.Entity;
using System.Linq;
using System.Windows;
using System.Windows.Controls;
using System.Windows.Input;
using ${t.app}.classes;

namespace ${t.app}.Windows
{
    public partial class TablesWindow : Window
    {
        public TablesWindow()
        {
            InitializeComponent();
            LoadAllTables();
        }

        private void LoadAllTables()
        {
            string search = TableSearchBox?.Text?.Trim() ?? "";

            var mainQuery = Core.DB.${t.mt}
                .Include(x => x.${t.lt})
                .Include(x => x.${t.mm})
                .ToList();

            if (!string.IsNullOrWhiteSpace(search))
            {
                mainQuery = mainQuery.Where(x =>
                    (x.Title != null && x.Title.IndexOf(search, StringComparison.OrdinalIgnoreCase) >= 0) ||
                    (x.${t.cc} != null && x.${t.cc}.IndexOf(search, StringComparison.OrdinalIgnoreCase) >= 0))
                    .ToList();
            }

            MainEntityGrid.ItemsSource = mainQuery;
            LookupGrid.ItemsSource = Core.DB.${t.lt}.OrderBy(x => x.ID).ToList();
            PartiesGrid.ItemsSource = Core.DB.${t.pt}.OrderBy(x => x.ID).ToList();

            var docs = Core.DB.${t.dt}
                .Include(d => d.${t.pt})
                .Include(d => d.${t.mm}.Select(j => j.${t.mt}))
                .OrderBy(d => d.ID)
                .ToList();
            DocsGrid.ItemsSource = docs;
            JunctionGrid.ItemsSource = Core.DB.${t.mm}
                .Include(j => j.${t.dt})
                .Include(j => j.${t.mt})
                .ToList();

            StatusCountText.Text = $"Записей в основной таблице: {mainQuery.Count} | Документов: {docs.Count}";
        }

        private void TableSearchBox_TextChanged(object sender, TextChangedEventArgs e) => LoadAllTables();

        private void RefreshTablesBtn_Click(object sender, RoutedEventArgs e) => LoadAllTables();

        private void DocsGrid_SelectionChanged(object sender, SelectionChangedEventArgs e)
        {
            if (DocsGrid.SelectedItem is ${t.dt} selectedDoc)
            {
                JunctionGrid.ItemsSource = selectedDoc.${t.mm}.ToList();
            }
        }

        private void MainEntityGrid_MouseDoubleClick(object sender, MouseButtonEventArgs e)
        {
            if (MainEntityGrid.SelectedItem is ${t.mt} selected)
            {
                var editWin = new EditWindow(selected);
                if (editWin.ShowDialog() == true)
                    LoadAllTables();
            }
        }

        private void AddRecordBtn_Click(object sender, RoutedEventArgs e)
        {
            var editWin = new EditWindow(new ${t.mt}());
            if (editWin.ShowDialog() == true)
                LoadAllTables();
        }

        private void BackBtn_Click(object sender, RoutedEventArgs e) => Close();
    }
}`;
        }

        function buildEditCs(t) {
            return `using System;
using System.Collections.Generic;
using System.ComponentModel;
using System.IO;
using System.Linq;
using System.Windows;
using Microsoft.Win32;
using ${t.app}.classes;

namespace ${t.app}.Windows
{
    public partial class EditWindow : Window, INotifyPropertyChanged
    {
        public event PropertyChangedEventHandler PropertyChanged;

        public ${t.mt} CurrentItem { get; set; }
        public List<${t.lt}> LookupList { get; set; }

        public string WindowTitle => CurrentItem.ID == 0
            ? "«${t.title}» — Добавление новой записи"
            : $"«${t.title}» — Редактирование ({CurrentItem.Title})";

        public EditWindow(${t.mt} item)
        {
            InitializeComponent();
            CurrentItem = item;
            LookupList = Core.DB.${t.lt}.OrderBy(x => x.Title).ToList();

            if (CurrentItem.ID == 0)
                DeleteBtn.Visibility = Visibility.Collapsed;

            this.DataContext = this;
        }

        private void Invalidate()
        {
            PropertyChanged?.Invoke(this, new PropertyChangedEventArgs(nameof(CurrentItem)));
            ItemImage.GetBindingExpression(System.Windows.Controls.Image.SourceProperty)?.UpdateTarget();
        }

        private void SelectImageBtn_Click(object sender, RoutedEventArgs e)
        {
            OpenFileDialog dlg = new OpenFileDialog { Filter = "Изображения|*.jpg;*.jpeg;*.png" };
            if (dlg.ShowDialog() == true)
            {
                string imagesDir = Path.Combine(Environment.CurrentDirectory, "images");
                Directory.CreateDirectory(imagesDir);

                string fileName = Path.GetFileName(dlg.FileName);
                string destPath = Path.Combine(imagesDir, fileName);

                if (!string.Equals(dlg.FileName, destPath, StringComparison.OrdinalIgnoreCase))
                    File.Copy(dlg.FileName, destPath, true);

                CurrentItem.ImagePath = Path.Combine("images", fileName);
                Invalidate();
            }
        }

        private void SaveBtn_Click(object sender, RoutedEventArgs e)
        {
            if (string.IsNullOrWhiteSpace(CurrentItem.${t.cc}) || string.IsNullOrWhiteSpace(CurrentItem.Title))
            {
                MessageBox.Show("Заполните обязательные поля: ${t.cl} и Наименование.",
                    "Ошибка валидации", MessageBoxButton.OK, MessageBoxImage.Error);
                return;
            }

            if (CurrentItem.${t.lt} == null)
            {
                MessageBox.Show("Выберите значение из выпадающего списка «${t.ll}».",
                    "Ошибка валидации", MessageBoxButton.OK, MessageBoxImage.Error);
                return;
            }

            if (CurrentItem.${t.pc} < 0 || CurrentItem.${t.m1} < 0 || CurrentItem.${t.m2} < 0)
            {
                MessageBox.Show("Числовые значения не могут быть отрицательными.",
                    "Ошибка валидации", MessageBoxButton.OK, MessageBoxImage.Error);
                return;
            }

            bool codeExists = Core.DB.${t.mt}.Any(x => x.${t.cc} == CurrentItem.${t.cc} && x.ID != CurrentItem.ID);
            if (codeExists)
            {
                MessageBox.Show("Запись с таким кодом/артикулом уже существует в базе данных.",
                    "Ошибка уникальности", MessageBoxButton.OK, MessageBoxImage.Error);
                return;
            }

            try
            {
                CurrentItem.${t.fk} = CurrentItem.${t.lt}.ID;
                if (CurrentItem.ID == 0)
                    Core.DB.${t.mt}.Add(CurrentItem);

                Core.DB.SaveChanges();
                this.DialogResult = true;
            }
            catch (Exception ex)
            {
                MessageBox.Show($"Ошибка при сохранении в БД: {ex.Message}",
                    "Ошибка базы данных", MessageBoxButton.OK, MessageBoxImage.Error);
            }
        }

        private void DeleteBtn_Click(object sender, RoutedEventArgs e)
        {
            // Проверка ссылочной целостности перед удалением
            bool hasLinkedDocs = Core.DB.${t.mm}.Any(j => j.MainID == CurrentItem.ID);
            if (hasLinkedDocs)
            {
                MessageBox.Show(
                    "Удаление запрещено! Данная запись используется в документах (таблица связи M:M).",
                    "Ошибка целостности данных", MessageBoxButton.OK, MessageBoxImage.Error);
                return;
            }

            var confirm = MessageBox.Show($"Вы действительно хотите удалить «{CurrentItem.Title}»?",
                "Подтверждение удаления", MessageBoxButton.YesNo, MessageBoxImage.Question);

            if (confirm == MessageBoxResult.Yes)
            {
                try
                {
                    Core.DB.${t.mt}.Remove(CurrentItem);
                    Core.DB.SaveChanges();
                    this.DialogResult = true;
                }
                catch (Exception ex)
                {
                    MessageBox.Show($"Ошибка при удалении: {ex.Message}",
                        "Ошибка базы данных", MessageBoxButton.OK, MessageBoxImage.Error);
                }
            }
        }

        private void CancelBtn_Click(object sender, RoutedEventArgs e)
        {
            if (CurrentItem.ID != 0)
                Core.DB.Entry(CurrentItem).Reload();
            this.DialogResult = false;
        }
    }
}`;
        }

        function buildMainCs(t) {
            return `using System;
using System.Collections.Generic;
using System.Data.Entity;
using System.Linq;
using System.Windows;
using System.Windows.Controls;
using System.Windows.Input;
using ${t.app}.classes;
using ${t.app}.Windows;

namespace ${t.app}
{
    public partial class MainWindow : Window
    {
        private int _currentPage = 1;
        private int _maxPages = 1;
        private const int ItemsPerPage = 5;
        private bool _isEditWindowOpen = false;

        private readonly List<string> _sortOptions = new List<string>
        {
            "${t.sorts[0]}",
            "${t.sorts[1]}",
            "${t.sorts[2]}",
            "${t.sorts[3]}",
            "${t.sorts[4]}",
            "${t.sorts[5]}",
            "${t.sorts[6]}"
        };

        public MainWindow()
        {
            InitializeComponent();
            this.DataContext = this;
            LoadControls();
            Refresh();
        }

        private void LoadControls()
        {
            SortComboBox.ItemsSource = _sortOptions;
            SortComboBox.SelectedIndex = 0;

            var categories = Core.DB.${t.lt}.OrderBy(x => x.Title).ToList();
            categories.Insert(0, new ${t.lt} { ID = 0, Title = "${t.la}" });
            FilterComboBox.ItemsSource = categories;
            FilterComboBox.SelectedIndex = 0;
        }

        /// <summary>
        /// Совместное выполнение фильтрации, поиска, сортировки и постраничного вывода.
        /// </summary>
        public void Refresh()
        {
            if (MainListView == null) return;

            IEnumerable<${t.mt}> query = Core.DB.${t.mt}
                .Include(x => x.${t.lt})
                .Include(x => x.${t.mm})
                .ToList();

            // 1. Фильтрация по справочнику
            if (FilterComboBox.SelectedItem is ${t.lt} selectedCat && selectedCat.ID != 0)
            {
                query = query.Where(x => x.${t.fk} == selectedCat.ID);
            }

            // 2. Регистронезависимый поиск по наименованию, коду и описанию
            string search = SearchTextBox.Text?.Trim();
            if (!string.IsNullOrWhiteSpace(search))
            {
                query = query.Where(x =>
                    (x.Title != null && x.Title.IndexOf(search, StringComparison.OrdinalIgnoreCase) >= 0) ||
                    (x.${t.cc} != null && x.${t.cc}.IndexOf(search, StringComparison.OrdinalIgnoreCase) >= 0) ||
                    (x.Description != null && x.Description.IndexOf(search, StringComparison.OrdinalIgnoreCase) >= 0));
            }

            // 3. Сортировка по 3 параметрам (по возрастанию и убыванию)
            switch (SortComboBox.SelectedIndex)
            {
                case 1: query = query.OrderBy(x => x.Title); break;
                case 2: query = query.OrderByDescending(x => x.Title); break;
                case 3: query = query.OrderBy(x => x.${t.m1}); break;
                case 4: query = query.OrderByDescending(x => x.${t.m1}); break;
                case 5: query = query.OrderBy(x => x.${t.pc}); break;
                case 6: query = query.OrderByDescending(x => x.${t.pc}); break;
                default: query = query.OrderBy(x => x.ID); break;
            }

            var result = query.ToList();

            // 4. Постраничный вывод (пагинация по 5 карточек на страницу)
            _maxPages = (int)Math.Ceiling(result.Count / (double)ItemsPerPage);
            if (_maxPages < 1) _maxPages = 1;
            if (_currentPage > _maxPages) _currentPage = _maxPages;
            if (_currentPage < 1) _currentPage = 1;

            MainListView.ItemsSource = result
                .Skip((_currentPage - 1) * ItemsPerPage)
                .Take(ItemsPerPage)
                .ToList();

            txtPage.Text = $"{_currentPage} / {_maxPages}";
        }

        private void SearchTextBox_TextChanged(object sender, TextChangedEventArgs e)
        {
            _currentPage = 1;
            Refresh();
        }

        private void SortComboBox_SelectionChanged(object sender, SelectionChangedEventArgs e)
        {
            _currentPage = 1;
            Refresh();
        }

        private void FilterComboBox_SelectionChanged(object sender, SelectionChangedEventArgs e)
        {
            _currentPage = 1;
            Refresh();
        }

        private void PrevPageBtn_Click(object sender, RoutedEventArgs e)
        {
            if (_currentPage > 1) { _currentPage--; Refresh(); }
        }

        private void NextPageBtn_Click(object sender, RoutedEventArgs e)
        {
            if (_currentPage < _maxPages) { _currentPage++; Refresh(); }
        }

        private void AddBtn_Click(object sender, RoutedEventArgs e)
        {
            OpenEditWindow(new ${t.mt}());
        }

        private void MainListView_MouseDoubleClick(object sender, MouseButtonEventArgs e)
        {
            if (MainListView.SelectedItem is ${t.mt} selected)
                OpenEditWindow(selected);
        }

        private void OpenEditWindow(${t.mt} item)
        {
            if (_isEditWindowOpen)
            {
                MessageBox.Show("Окно редактирования уже открыто.", "Внимание",
                    MessageBoxButton.OK, MessageBoxImage.Warning);
                return;
            }

            _isEditWindowOpen = true;
            try
            {
                var win = new EditWindow(item);
                if (win.ShowDialog() == true)
                    Refresh();
            }
            finally
            {
                _isEditWindowOpen = false;
            }
        }

        private void OpenTablesBtn_Click(object sender, RoutedEventArgs e)
        {
            var win = new TablesWindow();
            win.ShowDialog();
            Refresh();
        }

        private void ExitBtn_Click(object sender, RoutedEventArgs e) => Application.Current.Shutdown();
    }
}`;
        }

        // Экранирование HTML и легкая подсветка синтаксиса для удобного чтения
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function highlightCode(rawCode, lang) {
            let escaped = escapeHtml(rawCode);
            if (lang === 'sql') {
                escaped = escaped.replace(/(--[^\n]*)/g, '<span class="tok-com">$1</span>');
                escaped = escaped.replace(/(N?'[^'\n]*')/g, '<span class="tok-str">$1</span>');
                escaped = escaped.replace(/\b(CREATE|DATABASE|TABLE|GO|USE|INT|PRIMARY|KEY|IDENTITY|NVARCHAR|MAX|NOT|NULL|UNIQUE|DECIMAL|CHECK|CONSTRAINT|FOREIGN|REFERENCES|ON|DELETE|CASCADE|DEFAULT|GETDATE|DATE|SET|IDENTITY_INSERT|INSERT|INTO|VALUES|SELECT|AS|COUNT|FROM|UNION|ALL|JOIN|AND)\b/gi, '<span class="tok-kw">$1</span>');
            } else if (lang === 'csharp') {
                escaped = escaped.replace(/(\/\/[^\n]*)/g, '<span class="tok-com">$1</span>');
                escaped = escaped.replace(/(\$?&quot;[^&quot;\n]*&quot;)/g, '<span class="tok-str">$1</span>');
                escaped = escaped.replace(/\b(using|namespace|public|private|class|partial|static|override|get|set|if|else|return|new|var|bool|int|string|decimal|void|try|catch|switch|case|default|break|finally|is|null|true|false)\b/g, '<span class="tok-kw">$1</span>');
                escaped = escaped.replace(/\b(Uri|Brush|SolidColorBrush|Color|Brushes|Window|INotifyPropertyChanged|PropertyChangedEventHandler|PropertyChangedEventArgs|OpenFileDialog|MessageBox|MessageBoxButton|MessageBoxImage|MessageBoxResult|RoutedEventArgs|TextChangedEventArgs|SelectionChangedEventArgs|MouseButtonEventArgs|Exception|List|IEnumerable|Path|File|Directory|Environment|Application)\b/g, '<span class="tok-type">$1</span>');
            } else if (lang === 'xaml') {
                escaped = escaped.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="tok-com">$1</span>');
                escaped = escaped.replace(/(&quot;[^&quot;]*&quot;)/g, '<span class="tok-str">$1</span>');
                escaped = escaped.replace(/(&lt;\/?[A-Za-z0-9_.]+)/g, '<span class="tok-tag">$1</span>');
            }
            return escaped;
        }

        // Создание карточки блока кода с кнопками «Копировать» и «Скачать файл»
        function renderCodeBlock(blockId, title, filename, lang, rawCode) {
            codeRegistry[blockId] = { code: rawCode, filename: filename };
            const lineCount = rawCode.split('\n').length;
            const highlighted = highlightCode(rawCode, lang);

            return `
            <div class="rounded-2xl overflow-hidden border border-slate-300 dark:border-slate-700 bg-[#0f172a] shadow-sm">
                <div class="px-4 py-2.5 bg-slate-800/95 border-b border-slate-700 flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center gap-2.5 min-w-0">
                        <span class="px-2 py-0.5 rounded-md text-[11px] font-bold uppercase tracking-wider ${
                            lang === 'sql' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' :
                            lang === 'xaml' ? 'bg-sky-500/20 text-sky-300 border border-sky-500/30' :
                            'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                        }">${lang}</span>
                        <span class="font-mono text-xs sm:text-sm font-semibold text-slate-100 truncate">${escapeHtml(filename)}</span>
                        <span class="hidden md:inline text-xs text-slate-400">• ${escapeHtml(title)} (${lineCount} строк)</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="downloadCode('${blockId}')"
                                class="px-2.5 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium transition flex items-center gap-1"
                                title="Скачать готовый файл ${escapeHtml(filename)}">
                            <span>⬇</span>
                            <span class="hidden sm:inline">Скачать</span>
                        </button>
                        <button id="copyBtn_${blockId}" onclick="copyCode('${blockId}')"
                                class="px-3 py-1.5 rounded-lg bg-[#E67E22] hover:bg-[#D35400] text-white text-xs font-semibold transition flex items-center gap-1.5 shadow-xs">
                            <span>📋</span>
                            <span>Копировать код</span>
                        </button>
                    </div>
                </div>
                <div class="overflow-x-auto max-h-[540px] overflow-y-auto">
                    <pre class="p-4 font-mono text-slate-100 leading-relaxed whitespace-pre" style="font-size: calc(12.5px * ${fontScale / 100});"><code>${highlighted}</code></pre>
                </div>
            </div>`;
        }

        // Копирование в буфер обмена через document.execCommand('copy') (работает в iframe и локально)
        function copyCode(blockId) {
            const entry = codeRegistry[blockId];
            if (!entry) return;

            const helper = document.getElementById('clipboardHelper');
            helper.value = entry.code;
            helper.select();
            helper.setSelectionRange(0, helper.value.length);

            let success = false;
            try {
                success = document.execCommand('copy');
            } catch (e) {
                success = false;
            }

            if (!success && navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(entry.code).catch(() => {});
            }

            const btn = document.getElementById(`copyBtn_${blockId}`);
            if (btn) {
                const origHtml = btn.innerHTML;
                btn.classList.remove('bg-[#E67E22]', 'hover:bg-[#D35400]');
                btn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
                btn.innerHTML = '<span>✓</span><span>Скопировано!</span>';
                setTimeout(() => {
                    btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
                    btn.classList.add('bg-[#E67E22]', 'hover:bg-[#D35400]');
                    btn.innerHTML = origHtml;
                }, 1800);
            }

            showToast(`Файл «${entry.filename}» скопирован в буфер обмена`);
        }

        // Скачивание отдельного файла (.sql / .xaml / .cs)
        function downloadCode(blockId) {
            const entry = codeRegistry[blockId];
            if (!entry) return;
            const pureName = entry.filename.split('/').pop();
            const blob = new Blob([entry.code], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = pureName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`Файл «${pureName}» скачан`);
        }

            const container = document.getElementById('toastContainer');

            toast.innerHTML = `<span class="text-emerald-400 font-bold">✓</span><span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);
            setTimeout(() => {

        function navigateTicket(delta) {

            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileOverlay');
            if (open) {
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const isDark = html.classList.toggle('dark');
            document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
            try {
                localStorage.setItem('mdk0101_theme', isDark ? 'dark' : 'light');
            } catch (e) {}
        }

        // Масштабирование шрифта для удобного чтения
        function changeFontScale(step) {
            fontScale = Math.min(130, Math.max(85, fontScale + step * 5));
            document.getElementById('fontScaleLabel').textContent = `${fontScale}%`;
            document.documentElement.style.fontSize = `${16 * (fontScale / 100)}px`;
            if (activeTicketNum > 0) renderTicket(activeTicketNum);
            else renderOverview();
        }

        // Инициализация при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {

                    document.documentElement.classList.add('dark');
